<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v13 · Contact sheet — Jessie Chen</title>
<style>
  @font-face{font-family:Hanken;src:url("../assets/fonts/HankenGrotesk.woff2") format("woff2");font-weight:100 900;font-display:swap}
  @font-face{font-family:"Barlow Condensed";src:url("../assets/fonts/BarlowCondensed-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
  :root{--table:#ecebe8;--ink:#151515;--body:#3c3c3a;--muted:#7c7b77;--line:#dcdad4;--film:#161514;--marker:#2344b8;
    --sans:Hanken,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--cond:"Barlow Condensed","Arial Narrow",sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(ellipse at 50% 45%,#fbfbf9 0%,var(--table) 70%);color:var(--body);font:15px/1.5 var(--sans);overflow:hidden}
  a{color:var(--ink);text-underline-offset:3px}
  .back{position:fixed;top:10px;left:14px;z-index:40;font-size:12px;color:var(--muted);text-decoration:none}
  .screen{height:100%;display:grid;grid-template-rows:auto 1fr;padding:30px 3vw 22px;gap:14px}
  .label{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
  .label b{font:600 24px/1 var(--cond);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
  .label b span{font-family:"Songti SC","Noto Serif CJK SC",serif;font-weight:400;font-size:14px;letter-spacing:.1em;color:var(--muted);margin-left:8px;text-transform:none}
  .label p{margin:0;font-size:14px;color:var(--body)}
  .label nav{margin-left:auto;font-size:13px;display:flex;gap:16px}

  .table{position:relative;min-height:0;display:grid;place-items:center}
  .sheet{position:relative;background:#fff;padding:2.2% 2.6% 2%;width:min(100%,calc((100vh - 120px) * 1.42));box-shadow:0 1px 2px rgba(0,0,0,.12),0 18px 44px rgba(0,0,0,.14);transform:rotate(-.4deg);transition:transform .5s cubic-bezier(.3,.7,.2,1)}
  body.open .sheet{transform:translateX(-19%) rotate(-.4deg) scale(.74)}
  .sheet .stamp{display:flex;justify-content:space-between;font:600 12px var(--cond);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 1.2%}
  .strip{position:relative;background:var(--film);padding:4.2% 1.6%;display:grid;grid-template-columns:repeat(3,1fr);gap:1.6%;margin-bottom:2.4%}
  .strip::before,.strip::after{content:"";position:absolute;left:1.2%;right:1.2%;height:2.2%;min-height:6px;background:repeating-linear-gradient(90deg,#e9e6dc 0 10px,transparent 10px 22px);border-radius:2px;opacity:.85}
  .strip::before{top:1.2%}.strip::after{bottom:1.2%}
  .fr{all:unset;position:relative;cursor:zoom-in;display:block;background:#000;aspect-ratio:16/10.5}
  .fr img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
  .fr.me img{object-position:50% 38%}
  .fr .no{position:absolute;left:0;bottom:-15%;font:600 11px var(--cond);color:#e9e6dc;letter-spacing:.08em}
  .fr .cap{position:absolute;right:0;bottom:-15%;font:600 11px var(--cond);color:#e9e6dc;text-transform:uppercase;letter-spacing:.08em}
  .fr .mark{position:absolute;inset:-7%;border:3px solid var(--marker);border-radius:10px;opacity:0;transform:rotate(-1.2deg) scale(1.04);transition:opacity .25s,transform .35s cubic-bezier(.2,1.3,.4,1);pointer-events:none}
  .fr.on .mark{opacity:1;transform:rotate(-1.2deg)}
  .fr:focus-visible{outline:2px solid var(--marker);outline-offset:4px}
  .hint{font-size:12.5px;color:var(--muted);margin:0;text-align:right}

  .loupe{position:fixed;z-index:20;width:200px;height:200px;border-radius:50%;pointer-events:none;border:6px solid #1c1c1b;box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.5);background-repeat:no-repeat;background-color:#fff;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s}
  .loupe.on{opacity:1;transform:none}

  .card{position:fixed;z-index:15;top:70px;right:3vw;bottom:24px;width:min(460px,42vw);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),0 24px 60px rgba(0,0,0,.18);padding:22px 24px;overflow:auto;transform:translateX(110%);transition:transform .5s cubic-bezier(.3,.7,.2,1)}
  body.open .card{transform:none}
  .card .x{all:unset;cursor:pointer;position:absolute;top:14px;right:16px;font-size:13px;color:var(--muted)}
  .card .n{font:600 12px var(--cond);text-transform:uppercase;letter-spacing:.08em;color:var(--marker)}
  .card h2{margin:2px 0 2px;font:600 30px/1 var(--cond);text-transform:uppercase;color:var(--ink)}
  .card .role{margin:0 0 12px;font-size:13px;color:var(--muted)}
  .card q{display:block;margin:0 0 14px;font:600 22px/1.1 var(--cond);text-transform:uppercase;color:var(--ink);quotes:"“" "”"}
  .view{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12);margin:0 0 10px;cursor:pointer}
  .view img{display:block;width:100%}
  .spot{position:absolute;border-radius:6px;box-shadow:0 0 0 2px #fff,0 0 0 9999px rgba(20,20,20,.45);opacity:0;transition:all .45s cubic-bezier(.3,.7,.2,1);pointer-events:none}
  .view.on .spot{opacity:1}
  .notes{list-style:none;margin:0 0 12px;padding:0}
  .notes button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:10px;padding:7px 8px;border-radius:8px;font-size:14px;line-height:1.45}
  .notes button:hover,.notes button.on{background:#f1f0ec;color:var(--ink)}
  .notes .k{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--marker);color:var(--marker);font-size:11px;line-height:17px;text-align:center}
  .notes button.on .k{background:var(--marker);color:#fff}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
  .nums div{border-top:2px solid var(--ink);padding-top:6px}
  .nums b{display:block;font:600 24px/1 var(--cond);color:var(--ink)}
  .nums span{display:block;font-size:11.5px;line-height:1.3;color:var(--muted);margin-top:3px}
  .lk a{margin-right:12px;font-size:14px}
  .card p{margin:0 0 10px;font-size:14px}
  .card ol{margin:0 0 10px;padding-left:1.1em;font-size:14px}.card li{margin:0 0 4px}.card li b{color:var(--ink)}
  .card img.ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 35%;margin:0 0 12px}

  @media (prefers-reduced-motion:reduce){.sheet,.card,.fr .mark,.spot,.loupe{transition:none}}
  @media (max-width:900px){body{overflow:auto}.screen{height:auto}.sheet{transform:none!important;width:100%}.strip{grid-template-columns:1fr 1fr}.card{position:static;width:auto;transform:none;display:none;margin-top:16px}body.open .card{display:block}.loupe{display:none}.label nav{margin-left:0}}
</style>
</head>
<body>

<div class="screen">

      <div class="strip"><button class="fr" data-i="3" style="--img:url(../assets/img/job-pilot.png)" aria-label="JobPilot"><img src="../assets/img/job-pilot.png" alt="JobPilot screenshot, in Chinese"><span class="no">4</span><span class="cap">JobPilot</span><span class="mark" aria-hidden="true"></span></button><button class="fr" data-i="4" style="--img:url(../assets/img/musiclaw.png)" aria-label="MusiClaw"><img src="../assets/img/musiclaw.png" alt="MusiClaw screenshot, in Chinese"><span class="no">5</span><span class="cap">MusiClaw</span><span class="mark" aria-hidden="true"></span></button><button class="fr me" data-i="me" style="--img:url(../assets/photos/ice-cave.jpg)" aria-label="About me"><img src="../assets/photos/ice-cave.jpg" alt="Jessie in an ice cave"><span class="no">6</span><span class="cap">Who shot these</span><span class="mark" aria-hidden="true"></span></button></div>

</div>

<script type="application/json" id="data">[{"t": "Lecture Companion", "img": "lecture-companion", "role": "Real-time lecture AI assistant", "q": "59 of 63 questions asked with zero typing", "p": "The bottleneck for asking questions in class is input friction, not model capability. I compressed a question into one click on a transcript sentence, and used multimodal retrieval to fill in whiteboard and formulas. The North Star is after-class review behavior; cost is managed line by line in a usage ledger.", "proves": "interaction design, a metrics system, cost engineering", "nums": [["63", "marks, 59 with zero typing"], ["3", "rollout stages, zero rollbacks"], ["¼", "ASR cost after a shadow run"]], "lk": [["Case study", "https://jessieyiqichen.github.io/projects/lecture-companion.html"], ["Live demo", "https://jessieyiqichen.github.io/lc-demo/"], ["Walkthrough", "https://jessieyiqichen.github.io/lecture-companion-walkthrough/"]], "boxes": [[29.44, 35.33, 18.06, 24.89, "Each blue dot is a mark: one click on a transcript sentence the student did not follow. No typing."], [73.75, 23.56, 25.0, 46.0, "The AI explains that sentence, with the board captured at the moment of the click."], [29.03, 6.0, 70.42, 8.44, "A real public lecture, recorded and processed: MIT 14.12, Game Theory."]], "emo": "🎓", "tint": "#e3eaf8"}, {"t": "xhs-threads", "img": "xhs-threads", "role": "Thought threads from Xiaohongshu bookmarks", "q": "90% of model calls on the light tier, ¥0.05–0.10 per item", "p": "Bookmarking is frequent; organizing almost never happens. I turned organizing into zero-label, proactive archiving: the user only saves, the AI threads, annotates and checks. Differentiation came from a survey of four competitor types; output quality is gated by an independent reviewer model.", "proves": "differentiated positioning, an AI evaluation system", "nums": [["11 · 63", "threads · nodes, read 2026-09"], ["90%", "of calls on the light tier"], ["¥0.05–0.10", "per item"]], "lk": [["Case study", "https://jessieyiqichen.github.io/projects/xhs-threads.html"], ["Guided demo", "https://47.94.34.146:8443/demo"], ["Try it", "https://47.94.34.146:8443/try"]], "boxes": [[13.75, 29.78, 28.06, 19.33, "The promise: turn your bookmarks back into your thinking."], [60.56, 16.0, 24.58, 16.89, "A thread: saved posts on a coffee-stall idea, grouped into one train of thought, 3 nodes."], [14.03, 63.11, 32.64, 8.44, "You only save. The AI does the threading, unattended, around the clock."]], "emo": "🔖", "tint": "#f8e3e0"}, {"t": "Nous", "img": "nous", "role": "Cognitive-twin message agent, three clients", "q": "Behavior prediction up from 49% to 71%", "p": "Other bots learn how you talk; this one learns how you decide. A message agent driven by a nine-dimension cognitive model: it judges whether to reply, drafts in your way, and raises a quality warning when you are about to say yes to something you will not do. Feishu bot, Mac floating assistant and Web, all three in daily production use.", "proves": "the full path from research to product", "nums": [["49→71%", "behavior prediction"], ["3", "clients live"], ["closed", "correction flywheel"]], "lk": [["Case study", "https://jessieyiqichen.github.io/projects/nous.html"], ["Guided demo", "https://jessieyiqichen.github.io/demos/nous.html"], ["Vision sandbox", "https://web-ten-omega-72.vercel.app/agent"]], "boxes": [[2.64, 29.11, 40.69, 12.89, "A colleague asks: free this weekend to sort the quarterly data? Needed Monday."], [63.47, 34.22, 25.69, 12.44, "Nous drafts the reply in my voice: busy, but I’ll do it this weekend; Monday OK?"], [63.47, 44.22, 25.56, 11.78, "The quality warning: I will probably say yes, and by habit start on Sunday night, so the draft buys a day."]], "emo": "💬", "tint": "#ebe4f7"}, {"t": "JobPilot", "img": "job-pilot", "role": "AI job-search strategist, open source", "q": "544 tests behind 31 commands, all six trade-offs written down", "p": "The job search is blocked by people, not information. Existing tools stop at the behavior layer; JobPilot plugs in a cognitive model and language samples to give personal diagnosis and messaging that sounds like you. All six product trade-offs have a written why.", "proves": "product insight, feature trade-offs, engineering quality", "nums": [["349 · 37", "jobs collected · high-score"], ["31 · 544", "CLI commands · tests, 2026-09"], ["CI", "plus a read-only live demo"]], "lk": [["Case study", "https://jessieyiqichen.github.io/projects/job-pilot.html"], ["Live demo", "https://jobpilot-demo-delta.vercel.app"], ["GitHub", "https://github.com/jessieyiqichen/job-pilot"]], "boxes": [[10.69, 17.56, 78.61, 14.44, "One-line diagnosis: nothing applied yet, but 37 high-score roles are waiting. Apply first, strategy later."], [10.69, 35.33, 20.56, 12.89, "37 high-score roles out of 349 collected."], [12.08, 57.33, 75.56, 26.44, "This week’s plan: each role scored, each with the next step."]], "emo": "🧭", "tint": "#e0f1e8"}, {"t": "MusiClaw", "img": "musiclaw", "role": "Shanghai musical-theatre market data", "q": "86 shows snapshotted every day, no one pressing a button", "p": "Public ticketing data turned into a data product that updates itself daily: seat-map snapshots for 86 shows, cast attribution analysis, four content pipelines, feeding a real data account. The AI's scope of responsibility is fully documented.", "proves": "a data product, a content operations loop", "nums": [["86", "shows snapshotted daily"], ["4", "content pipelines"], ["24 h", "fixed post-publish review"]], "lk": [["Case study", "https://jessieyiqichen.github.io/projects/musiclaw.html"], ["Dashboard", "https://jessieyiqichen.github.io/musiclaw-demo/"]], "boxes": [[59.58, 9.33, 32.92, 68.22, "Today’s pick: a sold-out run, flagged on the poster."], [2.64, 63.56, 42.78, 10.44, "100% sold, 1,928 of 1,928 seats, 45.1K want to see it."], [49.86, 81.33, 40.56, 10.67, "It updates itself every day; the next run is at 06:00."]], "emo": "🎭", "tint": "#f7ecd9"}]</script>
<script>
(function(){
  let D;try{D=JSON.parse(document.getElementById('data').textContent)}catch(e){console.error('product data unreadable',e);return}
  const body=document.body,card=document.getElementById('card'),loupe=document.getElementById('loupe'),frs=[...document.querySelectorAll('.fr')];
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let cur=null,k=-1;
  /* loupe: 2.6x of the frame under the cursor */
  frs.forEach(f=>{
    f.addEventListener('mousemove',e=>{
      const im=f.querySelector('img'),r=f.getBoundingClientRect(),Z=2.6,R=100;
      const ar=(im.naturalWidth/im.naturalHeight)||1.6;
      let dw,dh;if(r.height*ar>=r.width){dh=r.height;dw=r.height*ar}else{dw=r.width;dh=r.width/ar}
      const me=f.classList.contains('me'),ox=me?(r.width-dw)*.5:0,oy=me?(r.height-dh)*.38:0;
      const mx=e.clientX-r.left-ox,my=e.clientY-r.top-oy;
      loupe.style.backgroundImage='url("'+im.currentSrc+'")';
      loupe.style.backgroundSize=(dw*Z)+'px '+(dh*Z)+'px';
      loupe.style.backgroundPosition=(R-mx*Z)+'px '+(R-my*Z)+'px';
      loupe.style.left=(e.clientX-R)+'px';loupe.style.top=(e.clientY-R)+'px';loupe.classList.add('on');
    });
    f.addEventListener('mouseleave',()=>loupe.classList.remove('on'));
  });
  function light(j){const v=card.querySelector('.view'),d=D[cur];if(!v||!d||!d.boxes[j])return;k=j;const b=d.boxes[j],s=v.querySelector('.spot');Object.assign(s.style,{left:b[0]+'%',top:b[1]+'%',width:b[2]+'%',height:b[3]+'%'});v.classList.add('on');card.querySelectorAll('.notes button').forEach((x,n)=>x.classList.toggle('on',n===j))}
  function pick(i){
    frs.forEach(f=>f.classList.toggle('on',f.dataset.i===String(i)));
    if(i==='me'){cur='me';
      card.innerHTML='<button class="x" data-x>close ✕</button><p class="n">frame 6</p><h2>Who shot these</h2><p class="role">Jessie Chen · 陈亦奇</p><img class="ph" src="../assets/photos/ice-cave.jpg" alt="Jessie inside an ice cave"><p>MA in Computational Social Science (economics track), University of Chicago, GPA 4.0, class of 2027. BSc Economics, The Chinese University of Hong Kong. Born in Wuhan; Chicago and Shanghai now. Off hours: music, travel, skiing and musicals; two cats, Titi and Pupu, and two dogs, Damai and Dami.</p><ol><li><b>Pain point before solution.</b> Find the layer the bottleneck lives in.</li><li><b>Staged rollout.</b> One layer of change per stage.</li><li><b>Metric before number.</b> Every number names its dashboard and read date.</li><li><b>Cost is a product parameter.</b> A shadow run proves quality first.</li></ol><p class="lk"><a href="mailto:jessiechenyiqi@outlook.com">jessiechenyiqi@outlook.com</a><a href="../assets/Jessie_Chen_Resume.pdf">Résumé (PDF)</a><a href="https://github.com/jessieyiqichen">GitHub</a></p>';
    }else{const d=D[i];if(!d)return;cur=i;
      card.innerHTML='<button class="x" data-x>close ✕</button><p class="n">frame '+(i+1)+'</p><h2>'+esc(d.t)+'</h2><p class="role">'+esc(d.role)+' · solo build</p><q>'+esc(d.q)+'</q>'+
        '<div class="view"><img src="../assets/img/'+d.img+'.png" alt="'+esc(d.t)+' screenshot, in Chinese"><span class="spot"></span></div>'+
        '<ol class="notes">'+d.boxes.map((b,j)=>'<li><button data-j="'+j+'"><span class="k">'+(j+1)+'</span><span>'+esc(b[4])+'</span></button></li>').join('')+'</ol>'+
        '<div class="nums">'+d.nums.map(([a,b])=>'<div><b>'+esc(a)+'</b><span>'+esc(b)+'</span></div>').join('')+'</div>'+
        '<p class="lk">'+d.lk.map(([a,u])=>'<a href="'+esc(u)+'">'+esc(a)+' ↗</a>').join('')+'</p>';
    }
    body.classList.add('open');card.scrollTop=0;
  }
  function close(){body.classList.remove('open');frs.forEach(f=>f.classList.remove('on'));cur=null}
  frs.forEach(f=>f.addEventListener('click',()=>{const i=f.dataset.i==='me'?'me':+f.dataset.i;if(cur===i)close();else pick(i)}));
  card.addEventListener('click',e=>{if(e.target.closest('[data-x]'))return close();const b=e.target.closest('.notes button');if(b)return light(+b.dataset.j);if(e.target.closest('.view'))light((k+1)%3)});
  card.addEventListener('mouseover',e=>{const b=e.target.closest('.notes button');if(b)light(+b.dataset.j)});
  addEventListener('keydown',e=>{
    if(e.key==='Escape')close();
    const order=[0,1,2,3,4,'me'];if(cur===null)return;const n=order.indexOf(cur);
    if(e.key==='ArrowRight')pick(order[(n+1)%6]);if(e.key==='ArrowLeft')pick(order[(n+5)%6]);
  });
})();
</script>
</body>
</html>
